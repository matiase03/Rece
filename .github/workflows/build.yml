name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Limpiar archivos de AI Studio
        run: rm -rf .gradle app-debug.apk recetario-debug.apk trampita trampita.bin trampita.dat trampita.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar keystore de debug propio
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Crear .env con la API key
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Ajustar gradle.properties para CI (evita crash de KSP)
        run: |
          sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/' gradle.properties
          sed -i 's/-Xmx4g -Dfile.encoding=UTF-8/-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true/' gradle.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: recetario-debug-apk
          path: app/build/outputs/apk/debug/*.apk
